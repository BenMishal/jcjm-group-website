<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background square -->
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <!-- Thin grid lines (architectural feel) -->
  <line x1="16" y1="4"  x2="16" y2="28" stroke="rgba(74,144,164,0.2)" stroke-width="0.5"/>
  <line x1="4"  y1="16" x2="28" y2="16" stroke="rgba(74,144,164,0.2)" stroke-width="0.5"/>
  <!-- Bold "J" letterform -->
  <text
    x="16"
    y="22"
    font-family="'Inter', 'Helvetica Neue', sans-serif"
    font-size="17"
    font-weight="700"
    fill="#e8eaed"
    text-anchor="middle"
    letter-spacing="-0.5"
  >JG</text>
  <!-- Accent underline bar -->
  <rect x="8" y="26" width="16" height="1.5" rx="0.75" fill="#4a90a4" opacity="0.8"/>
</svg>
